spring.application.name=mini-quests
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate는 엔티티와 DB 스키마가 맞는지만 확인
spring.jpa.hibernate.ddl-auto=validate
# 트랜잭션 끝나 DB 커넥션 반납
spring.jpa.open-in-view=false

# keycloak 발급자 주소 설정
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:8080/realms/mini-quests