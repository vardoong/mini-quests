name: Notify Slack on CI result

on:
  workflow_run:
    workflows: [ "Backend CI" ]
    types: [ completed ]

permissions: { }

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: 'Post Content :rocket:'
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            title="✅ CI 성공"; color="#2eb886"
          else
            title="❌ CI 실패"; color="#e01e5a"
          fi
          text=$(printf '*%s: %s*\n%s\n워크플로: %s\n브랜치: %s\n실행한 사람: %s\n<%s|실행 결과 보기>' \
            "$title" "$REPO" "$SLACK_MESSAGE" "$WORKFLOW" "$BRANCH" "$ACTOR" "$RUN_URL")
          payload=$(jq -n --arg text "$text" --arg color "$color" \
            '{attachments: [{color: $color, blocks: [{type: "section", expand: true, text: {type: "mrkdwn", text: $text}}]}]}')
          echo "$payload"
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"